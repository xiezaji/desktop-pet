<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q Pet · 桌面宠物</title>
<meta name="description" content="把喜欢的角色放到网页上：会呼吸、会说话、有表情的桌宠。">
<link rel="icon" href="assets/chars/奶蛙/portrait.webp">
<script>
window.__diag={errors:[]};
window.addEventListener('error',e=>window.__diag.errors.push(e.message+' @'+e.filename+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>window.__diag.errors.push('Promise:'+(e.reason&&e.reason.message||e.reason)));
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <!-- ══════════ 左：角色舞台 ══════════ -->
  <section class="stage">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <span>Q Pet</span>
      </div>
      <div class="topbar-sp"></div>
      <span class="pill" id="pill-char">角色 <b>—</b></span>
      <span class="pill" id="pill-voice">语音 <b>—</b></span>
      <span class="pill" id="pill-fps">帧率 <b>—</b></span>
    </header>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="pet-canvas"></canvas>

      <div class="loader" id="loader">
        <div class="loader-box">
          <div class="loader-title">Q Pet</div>
          <div class="loader-sub">正在准备你的桌宠…</div>
          <div class="bar"><i></i></div>
          <div class="loader-tip">加载素材 0/0</div>
        </div>
      </div>
    </div>

    <footer class="hint-bar">
      <span><kbd>拖拽</kbd>移动</span>
      <span><kbd>点击</kbd>说话</span>
      <span><kbd>滚轮</kbd>在气泡上滚动长台词</span>
      <span><kbd>右键</kbd>更多</span>
    </footer>
  </section>

  <!-- ══════════ 右：设置面板 ══════════ -->
  <aside class="panel" id="panel">
    <div class="panel-head">
      <h2>设置中心</h2>
      <div class="topbar-sp"></div>
      <button class="icon-btn" id="btn-reset-pos" title="重置位置">⌖</button>
      <button class="icon-btn" id="btn-close-panel" title="收起面板">›</button>
    </div>

    <nav class="tabs" id="tabs"></nav>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<button class="fab" id="btn-open-panel" title="打开设置">⚙</button>
<div id="toast"></div>

<script src="js/frames.js"></script>
<script src="js/bubble.js"></script>
<script src="js/audio.js"></script>
<script src="js/stats.js"></script>
<script src="js/chars.js"></script>
<script src="js/settings.js"></script>
<script src="js/core.js"></script>
<script src="js/app.js"></script>
</body>
</html>
